[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foodfm"
version = "0.1.0"
description = "Nutrition-grounded open LLM: standards, country food habits, age and health factors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
train = [
  "torch>=2.3",
  "transformers>=4.46",
  "peft>=0.13",
  "accelerate>=0.34",
  "bitsandbytes>=0.44; platform_system == 'Linux'",
  "sentencepiece",
]
dev = ["pytest>=8"]

[project.scripts]
foodfm = "foodfm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
