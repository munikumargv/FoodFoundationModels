name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Dataset builds
        run: foodfm build-dataset --n-profiles 200 --out-dir /tmp/data
      - name: Example profiles render
        run: |
          for f in examples/*.json; do foodfm recommend --profile "$f" --engine builtin > /dev/null; done
      - name: Gap analyzer runs for every demo persona
        run: |
          for p in priya james amara hiroshi; do foodfm analyze --persona "$p" > /dev/null; done
      - name: Web bundle builds
        run: python scripts/build_site.py --out /tmp/site
