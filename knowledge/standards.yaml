# Nutrition reference standards used to ground the model.
#
# Primary sources:
#   WHO   - World Health Organization healthy diet fact sheet & guidelines
#           (sugars 2015, sodium/potassium 2012, fats & carbohydrates 2023)
#   NASEM - US National Academies Dietary Reference Intakes (RDA / AI / AMDR / CDRR)
#   FAO/WHO/UNU - Human energy requirements (2004), Schofield BMR equations (1985)
#   ESPEN / PROT-AGE - protein for older adults
#
# Values are for healthy individuals. They are population reference values,
# not clinical prescriptions. Re-verify against the latest editions before
# production use (see `last_reviewed`).

last_reviewed: "2026-10"

who_population_goals:
  - id: free_sugars
    text: "Free sugars below 10% of total energy intake, with further benefit below 5% (about 25 g/day for an adult)."
    source: "WHO Guideline: Sugars intake for adults and children (2015)"
  - id: sodium
    text: "Sodium below 2000 mg/day (salt below 5 g/day) for adults; adjust downward for children aged 2-15 according to their energy needs. Use iodized salt."
    source: "WHO Guideline: Sodium intake for adults and children (2012)"
  - id: potassium
    text: "Potassium at least 3510 mg/day for adults, mainly from fruits, vegetables, legumes and nuts."
    source: "WHO Guideline: Potassium intake for adults and children (2012)"
  - id: total_fat
    text: "Total fat not more than 30% of total energy; saturated fat below 10%; trans fat below 1%. Prefer unsaturated fats (vegetable oils, nuts, fish)."
    source: "WHO Guideline: Saturated fatty acid and trans-fatty acid intake (2023)"
  - id: fruit_veg
    text: "At least 400 g (5 portions) of fruits and vegetables per day, excluding starchy roots such as potatoes and cassava."
    source: "WHO Healthy diet fact sheet"
  - id: fibre
    text: "Naturally occurring dietary fibre of at least 25 g/day for adults and children 10+, 21 g/day for ages 6-9, and 15 g/day for ages 2-5, from whole grains, vegetables, fruits and pulses."
    source: "WHO Guideline: Carbohydrate intake for adults and children (2023)"
  - id: breastfeeding
    text: "Exclusive breastfeeding for the first 6 months, then safe and adequate complementary foods with continued breastfeeding up to 2 years or beyond. Do not add salt or sugar to complementary foods."
    source: "WHO/UNICEF Infant and young child feeding guidance"
  - id: physical_activity
    text: "Adults: 150-300 minutes of moderate or 75-150 minutes of vigorous activity per week plus muscle strengthening on 2+ days. Children 5-17: an average of 60 minutes per day of moderate-to-vigorous activity."
    source: "WHO Guidelines on physical activity and sedentary behaviour (2020)"

# Acceptable Macronutrient Distribution Ranges (% of energy), NASEM.
amdr:
  "1-3":   {protein: [5, 20],  fat: [30, 40], carbohydrate: [45, 65]}
  "4-18":  {protein: [10, 30], fat: [25, 35], carbohydrate: [45, 65]}
  "19+":   {protein: [10, 35], fat: [20, 35], carbohydrate: [45, 65]}

# Protein RDA in g per kg body weight per day (NASEM), plus older-adult guidance.
protein_g_per_kg:
  "1-3": 1.05
  "4-13": 0.95
  "14-18": 0.85
  "19-64": 0.8
  "65+": 1.0          # PROT-AGE / ESPEN: 1.0-1.2 g/kg healthy older adults; 1.2-1.5 with acute/chronic illness
  pregnancy: 1.1
  lactation: 1.3
protein_infant_g_per_day:   # NASEM AI (absolute grams)
  "0-6 months": 9.1
  "7-12 months": 11

