# Energy requirement methodology.
energy:
  adult_bmr_equation: "Mifflin-St Jeor: 10*kg + 6.25*cm - 5*age + 5 (male) or - 161 (female)"
  child_bmr_equation: "FAO/WHO/UNU (Schofield, 1985) weight-based equations for ages 3-17"
  physical_activity_levels:     # PAL multipliers applied to BMR (FAO/WHO/UNU 2004 bands)
    sedentary: 1.40
    light: 1.55
    moderate: 1.75
    vigorous: 2.00
  pregnancy_extra_kcal:         # NASEM
    trimester_1: 0
    trimester_2: 340
    trimester_3: 452
  lactation_extra_kcal: 330     # first 6 months (500 kcal minus 170 kcal from maternal stores)
  weight_change_note: "A deficit of about 500 kcal/day yields roughly 0.5 kg/week loss. Do not go below ~1200 kcal/day (women) or ~1500 kcal/day (men) without clinical supervision; no deficits for children, pregnancy or lactation."
