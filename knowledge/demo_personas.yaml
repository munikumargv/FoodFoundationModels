# Demo personas: default values so the analyzer can be demonstrated without
# real photos or lab reports. Each meal is a "photo" whose detected foods are
# pre-filled (servings are multiples of the food's standard serving).
# lab_report is plain text in the format a typical lab printout uses; it is
# parsed by the same code that reads uploaded reports.

personas:
  - id: priya
    name: Priya
    tagline: "32 · India · vegetarian · tired, hair fall"
    profile: {country: india, age: 32, sex: female, weight_kg: 58, height_cm: 158, activity_level: light, life_stage: none, dietary_pattern: vegetarian_lacto_ovo, allergies: []}
    meals:
      - {name: Breakfast, items: [{food: idli, servings: 1}, {food: dal, servings: 0.5}, {food: chai, servings: 1}]}
      - {name: Lunch, items: [{food: white_rice, servings: 1.5}, {food: dal, servings: 1}, {food: mixed_veg_curry, servings: 1}, {food: curd, servings: 0.5}]}
      - {name: Evening snack, items: [{food: samosa, servings: 1}, {food: chai, servings: 1}]}
      - {name: Dinner, items: [{food: roti, servings: 2}, {food: mixed_veg_curry, servings: 1}]}
    lab_report: |
      CITY DIAGNOSTICS - Complete Blood & Vitamin Panel
      Patient: Priya S.   Age/Sex: 32/F
      Hemoglobin            10.8   g/dL     12.0 - 15.5
      Serum Ferritin         9     ng/mL    15 - 150
      25-OH Vitamin D       14     ng/mL    30 - 100
      Vitamin B12          182     pg/mL    200 - 900
      HbA1c                  5.6   %        < 5.7
      LDL Cholesterol      118     mg/dL    < 130
      TSH                    2.1   mIU/L    0.4 - 4.5

