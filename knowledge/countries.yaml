# Food habits of the 25 most populous countries (UN World Population Prospects
# ranking, ~2024). To use a different "top 25" (e.g. by GDP), edit this list;
# every entry needs the same keys (see tests/test_knowledge.py).
#
# guideline: national food-based dietary guideline (FBDG); verify the latest
#            edition via the FAO FBDG repository before production use.

last_reviewed: "2026-10"
ranking_basis: "population"

countries:
  - id: india
    name: India
    region: South Asia
    guideline: "ICMR-NIN Dietary Guidelines for Indians (2024), 'My Plate for the Day'"
    staples: [rice, wheat (roti/chapati), pulses (dal), "millets (ragi, jowar, bajra)", milk and curd, ghee, vegetables, spices]
    typical_meals: "Breakfast of idli/dosa/poha/paratha; lunch and dinner of rice or roti with dal, sabzi (vegetable curry), curd and pickle; tea with milk and sugar through the day."
    healthy_traditions: ["pulses with cereals (complementary protein)", "fermented foods (idli, dosa, curd)", "millets", "spices like turmeric", "high vegetarian share"]
    concerns: ["iron-deficiency anaemia (especially women and children)", "vitamin B12 and D deficiency", "rising type 2 diabetes and refined carbohydrate intake", "high salt from pickles/snacks", "fried snacks and vanaspati (trans fat)", "child stunting alongside adult obesity"]
    cultural_religious: ["~25-30% vegetarian", "Hindu beef avoidance", "Muslim halal practice", "Jain no-root-vegetable diet", "frequent fasting days (Navratri, Ekadashi, Ramadan)"]
    nutrient_sources:
      protein: [dal, chana, rajma, paneer, curd, eggs, chicken, fish]
      iron: ["green leafy vegetables (palak, methi)", ragi, lentils, rajma, chicken liver]
      calcium: [milk, curd, paneer, ragi, sesame (til)]
      b12: [milk, curd, eggs, fish, fortified foods]
    healthier_swaps: ["brown rice/millets for part of white rice", "roasted chana instead of namkeen", "mustard/groundnut oil in moderation instead of vanaspati", "less sugar in tea"]

  - id: china
    name: China
    region: East Asia
    guideline: "Chinese Dietary Guidelines (2022), Chinese Food Pagoda and Balanced Dietary Plate"
    staples: [rice (south), wheat noodles and steamed buns (north), pork, vegetables, "soy foods (tofu, soy milk)", eggs, tea]
    typical_meals: "Congee, baozi or soy milk with youtiao for breakfast; rice or noodles with several shared stir-fried vegetable and meat dishes at lunch and dinner."
    healthy_traditions: ["high vegetable intake", "soy foods", "tea instead of sugary drinks", "shared dishes encouraging variety"]
    concerns: ["very high sodium (soy sauce, pickles, MSG) - average salt intake ~10 g/day", "hypertension and stroke", "rising obesity and diabetes", "low dairy and calcium intake", "high cooking-oil use"]
    cultural_religious: ["largely no dietary restrictions", "Buddhist vegetarian minority", "Hui/Uyghur Muslim halal practice", "high prevalence of lactose intolerance"]
    nutrient_sources:
      protein: [tofu, soy milk, eggs, fish, pork, chicken]
      iron: [pork liver, beef, black fungus, tofu, leafy greens]
      calcium: [calcium-set tofu, bok choy, sesame paste, small dried fish, dairy if tolerated]
      b12: [eggs, fish, meat, fermented products (unreliable)]
    healthier_swaps: ["low-sodium soy sauce and less salt", "steaming instead of deep-frying", "whole grains (millet, oats, corn) for part of white rice", "add milk or yoghurt daily"]

