# Food composition table used to turn meal photos into nutrient intake.
#
# Values are APPROXIMATE per stated serving, compiled from USDA FoodData Central
# and national tables (e.g. Indian Food Composition Tables) for typical home
# recipes. Recipes vary widely; treat results as estimates for screening, not
# clinical assessment. Replace with a validated national database for
# production.
#
# Keys per food:
#   diet:      vegan | vegetarian (dairy/egg) | pescatarian (fish/seafood) | meat
#   allergens: milk, egg, fish_shellfish, wheat, peanut, tree_nut, soy, sesame
#   countries: country ids from countries.yaml where the food is typical, or [global]
#   keywords:  words matched against photo file names / vision-model labels
#   n:         nutrients per serving - kcal, protein g, carbs g, fat g, sat_fat g,
#              fibre g, free_sugar g (added sugars + juice, WHO definition),
#              sodium mg, calcium mg, iron mg, zinc mg, vit_a mcg RAE, vit_c mg,
#              vit_d IU, b12 mcg, folate mcg DFE (missing = 0)

